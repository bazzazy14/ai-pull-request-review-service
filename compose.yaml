services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [redis]
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on: [redis]
volumes:
  redis-data:
